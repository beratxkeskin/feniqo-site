<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FeniqoMobil</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --link-color: #38bdf8;
      --link-hover: #7dd3fc;
      --border-color: #334155;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --link-color: #0284c7;
        --link-hover: #0369a1;
        --border-color: #e2e8f0;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      line-height: 1.6;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 32rem;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--text-main);
      letter-spacing: -0.025em;
    }
    .description {
      font-size: 1rem;
      color: var(--text-main);
      margin-bottom: 1rem;
    }
    .description-en {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }
    .attribution-box {
      border-top: 1px solid var(--border-color);
      padding-top: 1.5rem;
      font-size: 0.95rem;
    }
    .attribution-link {
      color: var(--link-color);
      text-decoration: underline;
      font-weight: 600;
      transition: color 0.15s ease;
      display: inline-block;
    }
    .attribution-link:hover,
    .attribution-link:focus {
      color: var(--link-hover);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>FeniqoMobil</h1>
    <p class="description">
      FeniqoMobil, tanınan iş yerlerini kullanıcıya göstermek amacıyla marka logolarından yararlanır.
    </p>
    <p class="description-en">
      FeniqoMobil uses brand logos to help users recognize known merchants.
    </p>
    <div class="attribution-box">
      <a class="attribution-link" href="https://logo.dev">Logos provided by Logo.dev</a>
    </div>
  </main>
</body>
</html>
